<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Surtos & mais</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="control.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Gerenciador de <strong>Surtos & mais</strong></h1>
    </header>
    <menu>
        <div class="menu">
            <button id="btn-casa" class="btn-menu">Casa<span class="material-icons">home</span></button>
            <button id="btn-correspondencia" class="btn-menu">Correpondencia<span class="material-icons">drafts</span></button>
            <button id="btn-arq" class="btn-menu">Arquivados<span class="material-icons">archived</span></button>
            <button id="btn-configuracoes" class="btn-menu">Configurações<span class="material-icons">settings</span></button>
        </div>
    </menu>

    <div class="home">
    <div class="welcome-banner">
        <h2>Oi Paula, tudo bem?</h2>
    </div>
    
    <div class="dashboard-grid">
        <div class="card correspondence-card">
            <div class="card-header">
                <span class="material-icons">drafts</span>
                <h3>Correspondências</h3>
            </div>
            <div class="card-list">
                <div class="list-item">
                    <span class="material-icons">radio_button_unchecked</span>
                    <div class="line"></div>
                </div>
                <div class="list-item">
                    <span class="material-icons">radio_button_unchecked</span>
                    <div class="line"></div>
                </div>
                <div class="list-item">
                    <span class="material-icons">radio_button_unchecked</span>
                    <div class="line"></div>
                </div>
            </div>
        </div>
        
        <div class="side-column">
            <div class="card profile-card">
                <div class="profile-avatar">
                <span class="material-icons">account_circle</span>
                </div>
                <div class="profile-text">
                    <h3>PAULA F.</h3>
                    <p>DESDE 2026</p>
                </div>
            </div>
            
            <div class="card extra-card"></div>
        </div>
    </div>
</div>


</body>
</html>
