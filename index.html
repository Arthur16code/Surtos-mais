<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surtos & mais Company - Roleta Mobile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden; /* Evita que a tela pule no celular */
        }

        h1, .p {
            text-align: center;
            margin: 10px 0;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            margin-top: 30px;
        }

        /* Inputs (Lado Esquerdo) */
        .container-inputs {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .container-inputs input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
        }

        .container-inputs button {
            padding: 10px;
            cursor: pointer;
        }

        /* Paleta Circular (Lado Direito) */
        .paleta-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none; /* Fundamental para o celular não bugar o gesto */
        }

        .paleta-wrapper:active {
            cursor: grabbing;
        }

        /* O Centro Fixo (Branco e limpo) */
        .central-tunnel {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none; /* Garante que o toque passe direto para a roleta */
        }

        /* Anel giratório completo */
        .color-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* Círculos de Cores */
        .color-item {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1>Surtos & mais Company</h1>
    <p class="p">Nos temos o objetivo de documentar seus surtos mentais.</p>
    
    <div class="main-wrapper">
        <div class="container-inputs">
            <div class="situacao">
                <input placeholder="Descreva a situação..." type="text" minlength="10" maxlength="40">
                <button onclick="nextStepSituation()">next</button>
            </div>
            <div class="pensamento">
                <input placeholder="Descreva o pensamento..." type="text" minlength="10" maxlength="40">
                <button onclick="nextStepThought()">next</button>
            </div>
        </div>

        <div class="paleta-wrapper" id="paletaWrapper">
            <div class="central-tunnel"></div>
            
            <div class="color-ring" id="colorRing">
                <div class="color-item" style="background: #ff4757;" data-color="#ff4757"></div>
                <div class="color-item" style="background: #ff6b81;" data-color="#ff6b81"></div>
                <div class="color-item" style="background: #ffa502;" data-color="#ffa502"></div>
                <div class="color-item" style="background: #ff7f50;" data-color="#ff7f50"></div>
                <div class="color-item" style="background: #eccc68;" data-color="#eccc68"></div>
                <div class="color-item" style="background: #2ed573;" data-color="#2ed573"></div>
                <div class="color-item" style="background: #7bed9f;" data-color="#7bed9f"></div>
                <div class="color-item" style="background: #00d2d3;" data-color="#00d2d3"></div>
                <div class="color-item" style="background: #01a3a4;" data-color="#01a3a4"></div>
                <div class="color-item" style="background: #1e90ff;" data-color="#1e90ff"></div>
                <div class="color-item" style="background: #70a1ff;" data-color="#70a1ff"></div>
                <div class="color-item" style="background: #5352ed;" data-color="#5352ed"></div>
                <div class="color-item" style="background: #3742fa;" data-color="#3742fa"></div>
                <div class="color-item" style="background: #9b59b6;" data-color="#9b59b6"></div>
                <div class="color-item" style="background: #ff47a3;" data-color="#ff47a3"></div>
                <div class="color-item" style="background: #dfe4ea;" data-color="#dfe4ea"></div>
                <div class="color-item" style="background: #2f3542;" data-color="#2f3542"></div>
                <div class="color-item" style="background: #747d8c;" data-color="#747d8c"></div>
                <div class="color-item" style="background: #ffa502;" data-color="#ffa502"></div>
                <div class="color-item" style="background: #ced6e0;" data-color="#ced6e0"></div>
            </div>
        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.color-item');
        const colorRing = document.getElementById('colorRing');
        const paletaWrapper = document.getElementById('paletaWrapper');
        
        const radius = 60;
        const totalItems = items.length;

        // Distribui as 20 cores em círculo
        items.forEach((item, index) => {
            const angle = (index * 2 * Math.PI) / totalItems;
            const x = Math.cos(angle) * radius - 13;
            const y = Math.sin(angle) * radius - 13;

            item.style.left = `50%`;
            item.style.top = `50%`;
            item.style.transform = `translate(${x}px, ${y}px)`;
        });

        let currentRotation = 0;
        let isInteracting = false;
        let startX = 0;

        // Início da interação (Mouse ou Toque)
        function handleStart(clientX) {
            isInteracting = true;
            startX = clientX;
        }

        // Movimento (Mouse ou Toque)
        function handleMove(clientX) {
            if (!isInteracting) return;
            const deltaX = clientX - startX;
            currentRotation += deltaX * 0.6; // Sensibilidade de giro
            startX = clientX;
            colorRing.style.transform = `rotate(${currentRotation}deg)`;
        }

        function handleEnd() {
            isInteracting = false;
        }

        // Eventos para Computador (Mouse)
        paletaWrapper.addEventListener('mousedown', (e) => handleStart(e.clientX));
        window.addEventListener('mousemove', (e) => handleMove(e.clientX));
        window.addEventListener('mouseup', handleEnd);

        // Eventos corrigidos para Celular (Touch)
        paletaWrapper.addEventListener('touchstart', (e) => {
            handleStart(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isInteracting) return;
            handleMove(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchend', handleEnd);

        // Suporte a scroll/roda do mouse
        paletaWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            currentRotation += e.deltaY * 0.2;
            colorRing.style.transform = `rotate(${currentRotation}deg)`;
        }, { passive: false });
    </script>

</body>
</html>
