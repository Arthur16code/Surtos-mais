<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta Circular 17 Cores Fixa</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .radial-menu {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-toggle {
            width: 60px;
            height: 60px;
            background: #222;
            border: 2px solid #444;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .menu-background {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: scale(6.5);
            z-index: 1;
        }

        .menu-item {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 5;
        }

        .menu-item:hover {
            transform: scale(1.2) !important;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="radial-menu">
        <div class="menu-background"></div>
        <div class="menu-toggle"></div>

        <!-- 17 Círculos de Cores -->
        <div class="menu-item" style="background: #ff4757;"></div>
        <div class="menu-item" style="background: #ff6b81;"></div>
        <div class="menu-item" style="background: #ffa502;"></div>
        <div class="menu-item" style="background: #ff7f50;"></div>
        <div class="menu-item" style="background: #eccc68;"></div>
        <div class="menu-item" style="background: #2ed573;"></div>
        <div class="menu-item" style="background: #7bed9f;"></div>
        <div class="menu-item" style="background: #00d2d3;"></div>
        <div class="menu-item" style="background: #01a3a4;"></div>
        <div class="menu-item" style="background: #1e90ff;"></div>
        <div class="menu-item" style="background: #70a1ff;"></div>
        <div class="menu-item" style="background: #5352ed;"></div>
        <div class="menu-item" style="background: #3742fa;"></div>
        <div class="menu-item" style="background: #9b59b6;"></div>
        <div class="menu-item" style="background: #ff6b81;"></div>
        <div class="menu-item" style="background: #dfe4ea;"></div>
        <div class="menu-item" style="background: #2f3542;"></div>
    </div>

    <script>
        const items = document.querySelectorAll('.menu-item');
        const radius = 130; // Raio maior para afastar os itens e evitar cortes
        const totalItems = items.length;

        items.forEach((item, index) => {
            const angle = (index * 2 * Math.PI) / totalItems;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            // Posiciona diretamente na expansão total, centralizando o item (-18px metade da largura/altura)
            item.style.transform = `translate(${x}px, ${y}px) scale(1)`;
        });
    </script>

</body>
</html>
