    <h1>Surtos & mais Company</h1>
    <p class="p">Nos temos o objetivo de documentar seus surtos mentais.</p>

        <div class="container-inputs">
            <div class="situacao">
                <input placeholder="O que rolou" type="text" minlength="10" maxlength="40">
                <button onclick="nextStepSituation()"><span class="material-icons">arrow_forward</span></button>
            </div>

            <div class="pensamento" style="display: none;">
                <input placeholder="O que passou pela sua mente" type="text" minlength="10" maxlength="60">
                <button onclick="backToSituation()"><span class="material-icons">arrow_back</span></button>
                <button onclick="nextStepThought()"><span class="material-icons">arrow_forward</span></button>
            </div>

            <div class="saida" style="display: none;">
                <input placeholder="O que voce fez" type="text" minlength="10" maxlength="60">
                <button onclick="backToThought()"><span class="material-icons">arrow_back</span></button>
                <button onclick="nextStepSaida()"><span class="material-icons">arrow_forward</span></button>
            </div>
